name: One-time set TELEGRAM_ADMIN_CHAT_ID

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_onetime-set-telegram-secret.yml

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set TELEGRAM_ADMIN_CHAT_ID secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_REPO_SECRETS_WRITE }}
        run: |
          set -euo pipefail
          echo -n "1839462329" | gh secret set TELEGRAM_ADMIN_CHAT_ID --repo "${{ github.repository }}"
          echo "done"
