name: Daily Closing Report

# 마감 리포트 본문(지수·수급·특징주·총평)을 러너 안에서 생성한다.
# 지금까지 이 단계는 시우 PC의 Cowork 예약작업(평일 16:15 KST)만 할 수 있었고,
# 2026-09-10 Windows 업데이트(KB5124008)가 로컬 샌드박스를 깨뜨리자 통째로 누락됐다.
# 이 워크플로가 PC 없이도 같은 결과를 만든다.
#
# 데이터는 전부 날짜 지정이 되는 API에서 가져오므로 과거 날짜 백필도 같은 경로로 처리한다.
#   workflow_dispatch → date=2026-09-10, force=1
#
# ⚠️ GitHub schedule은 이 저장소에서 2~6시간까지 밀린다(2026-09-07 실측 23:19).
#    정시 실행은 Supabase pg_cron이 workflow_dispatch로 호출하는 경로를 주 트리거로 쓴다.
#    → pg_cron 등록 권장: 평일 16:20 KST
#    아래 schedule(16:20 KST)은 백업이고, PC 예약작업이 먼저 채웠으면 조용히 건너뛴다.
on:
  schedule:
    - cron: "20 7 * * 1-5" # 16:20 KST (백업 — 밀릴 수 있음)
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜(YYYY-MM-DD). 비우면 오늘 — 과거 날짜 백필용"
        required: false
        default: ""
      force:
        description: "1이면 본문이 이미 있어도 덮어씀"
        required: false
        default: "0"
      skip_ai:
        description: "1이면 지수·수급만 채우고 본문(OpenAI 과금)은 건너뜀"
        required: false
        default: "0"
      news_file:
        description: "백필용 보강 뉴스 JSON 경로(저장소 내). 예: data/backfill-news-2026-09-10.json"
        required: false
        default: ""
  repository_dispatch:
    types: [daily-closing-report]

permissions:
  contents: write

concurrency:
  group: daily-closing-report
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  VERCEL_ORG_ID: team_QubZdjmTuImLo6ClM59KHPrt
  VERCEL_PROJECT_ID: prj_VnAs98x3Puq8qzzdylHyrGyYZHFJ

jobs:
  build-report:
    name: Generate closing report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate closing report
        id: gen
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCESS_TOKEN: ${{ secrets.KIS_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.CLOSING_REPORT_MODEL || 'gpt-5.1' }}
          TARGET_DATE: ${{ github.event.inputs.date || github.event.client_payload.date || '' }}
          FORCE: ${{ github.event.inputs.force == '1' && '1' || '' }}
          SKIP_AI: ${{ github.event.inputs.skip_ai == '1' && '1' || '' }}
          # 백필용 — 사람이 모아 둔 뉴스를 넣어두면 재료 근거로 함께 쓴다
          NEWS_CONTEXT_FILE: ${{ github.event.inputs.news_file || '' }}
        run: node scripts/daily-closing-report.mjs

      - name: Commit report
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/daily-market.json data/daily; then
            echo "::notice::리포트 변경 없음 — 커밋 생략"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
            git add data/daily-market.json data/daily
            # 커밋 메시지에 "AI 마감시황 분석"이 들어가야 telegram-notify.yml이 채널로 발송한다.
            # (그 워크플로가 push 이벤트를 이 문구로 걸러낸다 — 문구를 바꾸면 텔레그램이 조용히 끊긴다)
            git commit -m "AI 마감시황 분석 - ${STAMP} (GitHub Actions 자동 생성)"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "::warning::push 실패 (${attempt}/3), 20초 후 재시도"
              sleep 20
            done
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@53.2.0 deploy --prod --token "$VERCEL_TOKEN" --yes

      # 실패하면 조용히 넘어가지 않는다 — 2026-09-10 사고의 재발 방지
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_ADMIN_CHAT_ID:-}" ]; then
            echo "텔레그램 시크릿 없음 — 알림 생략"
            exit 0
          fi
          MSG=$(printf '[마감리포트] 자동 생성 실패 — 확인 필요\n%s' "$RUN_URL")
          curl -sS --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
