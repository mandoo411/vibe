name: DART Corp Code Map

# DART corp_code(고유번호) ↔ 종목코드 전체 매핑 갱신.
# AI 종목분석의 "실적 추이" 카드가 임의 종목을 조회하려면 상장사 전체 매핑이 필요하다.
# 신규 상장·상장폐지 반영을 위해 매주 1회 + 필요할 때 수동 실행.
#
# ⚠️ corpCode.xml은 20MB대 zip이고 과거(2026-08-28) 30초 타임아웃으로 계속 실패한
#    이력이 있다. 스크립트가 180초 타임아웃 + 3회 재시도를 하므로 job 타임아웃도
#    넉넉히 준다. 실패하면 기존 data/dart-corp-map.json은 건드리지 않는다.

on:
  schedule:
    # 매주 일요일 07:00 KST = 토요일 22:00 UTC
    - cron: "0 22 * * 6"
  workflow_dispatch:
  # Cowork 세션의 PAT에는 Actions 실행 권한이 없어 workflow_dispatch를 못 부른다.
  # 저장소 쓰기 권한만으로 부를 수 있는 repository_dispatch를 함께 열어 둔다
  # (마감시황 재시도에서 이미 쓰고 있는 방식과 동일).
  repository_dispatch:
    types: [dart-corp-map]

permissions:
  contents: write

concurrency:
  group: dart-corp-map
  cancel-in-progress: false

env:
  # data/ 전용 커밋은 vercel.json의 ignoreCommand가 자동 배포를 건너뛴다. 아래 Deploy
  # 스텝이 없으면 매핑이 커밋만 되고 함수 번들에는 영영 안 들어간다(kr-screener-cache.yml과
  # 같은 패턴). 중복 프로젝트 사고 재발방지로 ORG/PROJECT ID도 함께 고정한다.
  VERCEL_ORG_ID: team_QubZdjmTuImLo6ClM59KHPrt
  VERCEL_PROJECT_ID: prj_VnAs98x3Puq8qzzdylHyrGyYZHFJ

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Node fetch로 직접 받으면 GitHub Actions 러너에서 20MB 전송이 정체돼
      # 180초를 채우고 0바이트로 죽는다(2026-09-03 3회 재현). curl은 넉넉한 총 제한시간과
      # "진짜 멈췄을 때만" 끊는 속도 임계값을 따로 줄 수 있어서 이 구간에 훨씬 강하다.
      - name: Download corpCode.xml (curl)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "다운로드 시도 ${attempt}/3"
            if curl -sS -L --fail \
                 --max-time 900 \
                 --connect-timeout 30 \
                 --speed-limit 1024 --speed-time 60 \
                 -A "TotalMoneyAI/1.0" \
                 -o /tmp/corpCode.zip \
                 -w "  수신 %{size_download} bytes / %{time_total}s (평균 %{speed_download} B/s)\n" \
                 "https://opendart.fss.or.kr/api/corpCode.xml?crtfc_key=${DART_API_KEY}"; then
              if [ "$(head -c 2 /tmp/corpCode.zip)" = "PK" ]; then
                echo "::notice::zip 수신 성공 ($(stat -c%s /tmp/corpCode.zip) bytes)"
                exit 0
              fi
              echo "zip이 아닌 응답(DART 에러로 추정):"
              head -c 300 /tmp/corpCode.zip; echo
            fi
            echo "실패 — 15초 후 재시도"
            sleep 15
          done
          echo "::error::corpCode.xml 다운로드 3회 모두 실패"
          exit 1

      - name: Build corp_code map
        run: node scripts/dart-corp-map.mjs --zip /tmp/corpCode.zip

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff --quiet는 untracked 신규 파일을 못 잡는다(dart-events.yml에서 겪은 사고).
          if [ -z "$(git status --porcelain -- data/dart-corp-map.json)" ]; then
            echo "::notice::corp_code map unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
          git add data/dart-corp-map.json
          git commit -m "chore(data): sync DART corp_code map ${STAMP}"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 매핑은 api/analyze.js가 require()로 번들에서 읽는다(비용 0). 배포가 없으면
      # 번들에 안 들어가서 매번 GitHub Contents API 폴백을 타게 되므로 여기서 명시 배포한다.
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@53.2.0 deploy --prod --token "$VERCEL_TOKEN" --yes
