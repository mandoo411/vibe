name: DART Events Sync

on:
  schedule:
    # 매일 06:10 KST = 전날 21:10 UTC (weekly-schedule 배치 직후)
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Collect DART events
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/dart-events.mjs

      - name: Commit and push updated events
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff --quiet는 '한 번도 커밋된 적 없는 새 파일(untracked)'은 아예
          # 비교 대상으로 안 잡아서 항상 조용히 통과해버린다 — 실제로 이 배치의
          # 첫 실행에서 data/dart-events.json이 생성됐는데도 이 체크 때문에 커밋을
          # 건너뛴 사고가 있었다. git status --porcelain은 신규/수정 파일을 모두
          # 잡아내므로 이걸로 바꾼다.
          if [ -z "$(git status --porcelain -- data/dart-events.json data/dart-corp-codes.json)" ]; then
            echo "::notice::No DART events changes to commit"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')
          git add data/dart-events.json data/dart-corp-codes.json
          git commit -m "chore(data): sync DART events ${STAMP}"
          git pull --rebase origin main
          git push
