name: Health Check (Site Monitor)

# 사이트 주요 기능(글로벌랭킹, 실시간시세, 모닝브리핑, 마감시황, 인스타 발행)을
# 매시간 자동으로 점검하고, 이상이 있을 때만 텔레그램 개인 DM으로 즉시 알림을 보낸다.
# 자세한 점검 항목/알림 로직은 scripts/health-check.mjs 주석 참고.
on:
  schedule:
    - cron: "5 * * * *" # 매시 5분 (KST/UTC 무관, 매시간)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: health-check
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run health check
        run: node scripts/health-check.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

      - name: Commit state file
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/health-check/state.json
          if git diff --staged --quiet; then
            echo "::notice::No state change"
            exit 0
          fi
          git commit -m "chore(health-check): state update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase origin main
          git push
