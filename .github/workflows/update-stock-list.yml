name: Update stock list

on:
  schedule:
    # KST 08:00 = UTC 23:00
    - cron: "0 23 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download KOSPI/KOSDAQ lists
        id: download
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          fetch_with_retry() {
            local url="$1" out="$2"
            local attempt
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -A "$UA" --connect-timeout 15 --max-time 60 "$url" -o "$out"; then
                return 0
              fi
              echo "::warning::KIND download attempt $attempt/5 failed for $out"
              sleep $((attempt * 10))
            done
            return 1
          }

          ok=true
          fetch_with_retry "https://kind.krx.co.kr/corpgeneral/corpList.do?method=download&searchType=13&marketType=stockMkt" kospi.xls || ok=false
          fetch_with_retry "https://kind.krx.co.kr/corpgeneral/corpList.do?method=download&searchType=13&marketType=kosdaqMkt" kosdaq.xls || ok=false

          if [ "$ok" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KRX KIND site did not respond after 5 retries (likely a transient IP/rate block). Skipping today's stock-list update; next scheduled run will retry."
          fi

      - name: Download KIS 종목마스터 (우선주 포함용)
        if: steps.download.outputs.ok == 'true'
        id: download_mst
        run: |
          set -uo pipefail
          ok=true
          curl -fsSL --connect-timeout 15 --max-time 60 "https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip" -o kospi_code.mst.zip || ok=false
          curl -fsSL --connect-timeout 15 --max-time 60 "https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip" -o kosdaq_code.mst.zip || ok=false
          if [ "$ok" = "true" ]; then
            unzip -o kospi_code.mst.zip -d mst_kospi
            unzip -o kosdaq_code.mst.zip -d mst_kosdaq
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KIS 종목마스터 다운로드 실패 — 우선주 병합 없이 진행합니다."
          fi

      - name: Build assets/stock-list.json
        if: steps.download.outputs.ok == 'true'
        run: |
          if [ "${{ steps.download_mst.outputs.ok }}" = "true" ]; then
            python scripts/update_stock_list.py kospi.xls kosdaq.xls assets/stock-list.json mst_kospi/kospi_code.mst mst_kosdaq/kosdaq_code.mst
          else
            python scripts/update_stock_list.py kospi.xls kosdaq.xls assets/stock-list.json
          fi

      - name: Commit and push if changed
        if: steps.download.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/stock-list.json; then
            echo "No changes."
            exit 0
          fi
          git add assets/stock-list.json
          git commit -m "Update assets/stock-list.json"
          git push
