name: Validate package.json

# package.json 문법이 깨지면 npm ci를 쓰는 워크플로우 11개(장중 시세 동기화,
# 인스타 자동 발행, 지표 실제수치 갱신 등)가 전부 조용히 실패한다.
# (2026-08-09 사고: trailing comma 하나 때문에 약 2시간 동안 이 워크플로우들이
# 전부 실패했는데 아무도 바로 눈치채지 못했다.)
# main에 package.json이 바뀔 때마다 즉시 문법을 검사해서, 깨졌으면 텔레그램으로
# 바로 알린다 — 1시간 주기인 Health Check보다 훨씬 빠르게 잡기 위한 안전망.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        id: check
        run: |
          if node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert Telegram (broken package.json)
        if: steps.check.outputs.valid == 'false'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          MSG="🚨 *package.json 문법 오류*\n방금 main에 반영된 package.json이 깨진 JSON입니다.\nnpm ci를 쓰는 워크플로우 11개(장중 시세 동기화, 인스타 자동 발행, 지표 실제수치 갱신 등)가 전부 실패합니다. 즉시 확인 필요."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ADMIN_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=$(printf '%b' "$MSG")" \
            > /dev/null

      - name: Fail job if invalid
        if: steps.check.outputs.valid == 'false'
        run: |
          echo "::error file=package.json::package.json is not valid JSON"
          exit 1
