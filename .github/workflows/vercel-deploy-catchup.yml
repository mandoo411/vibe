# Vercel 일일 배포 한도(100회, api-deployments-free-per-day) 초과로 그날 커밋이 배포 안 됐을 때
# 대비용 — 매일 09:00 KST(00:00 UTC)에 main 최신 코드를 재배포합니다.
# 2026-08-26: cron이 "0 0 21 5 *"(2026-05-21 단 하루)로 박혀 있어서 이름/주석과 달리
# 실제로는 매일 도는 캐치업이 아니었던 버그를 발견해 수정함 — 그날 이전까지는 한도 초과로
# 배포가 밀려도 다음날 자동으로 안 따라잡히고 있었음(예: 같은 날 오전 2bd7a0d4 커밋,
# 오후 3bd00239/ec256579/225781eb 커밋 모두 한도 초과로 자동배포가 안 걸렸던 사례).
name: Deploy Vercel (catch-up)

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_QubZdjmTuImLo6ClM59KHPrt
  VERCEL_PROJECT_ID: prj_VnAs98x3Puq8qzzdylHyrGyYZHFJ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GITHUB_TOKEN for repo-data API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT_REPO_SECRETS_WRITE }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "GH_PAT_REPO_SECRETS_WRITE missing — skip GITHUB_TOKEN sync"
            exit 0
          fi
          npx --yes vercel@53.2.0 env rm GITHUB_TOKEN production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf "%s" "$GH_PAT" | npx --yes vercel@53.2.0 env add GITHUB_TOKEN production --token "$VERCEL_TOKEN" --force
          echo "GITHUB_TOKEN synced to Vercel production."

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@53.2.0 deploy --prod --token "$VERCEL_TOKEN" --yes
