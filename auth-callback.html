    <script>
      (function () {
        const statusEl = document.getElementById("cb-status");
        const msgEl = document.getElementById("cb-msg");
        const backEl = document.getElementById("cb-back");

        function fail(text) {
          statusEl.hidden = true;
          backEl.hidden = false;
          msgEl.textContent = text;
          msgEl.classList.add("is-visible", "tm-auth-msg--error");
        }

        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
        let next = window.TMAuth.safeNext(params.get("next") || "") || "/mypage.html";

        const oauthErr = params.get("error_description") || hashParams.get("error_description") || params.get("error");
        if (oauthErr) {
          fail(decodeURIComponent(String(oauthErr).replace(/\+/g, " ")));
          return;
        }

        // 동의 이력이 없으면 동의 페이지로 보낸다(소셜 최초 가입자)
        async function finish() {
          const st = await window.TMAuth.refreshState();
          if (!st.hasConsent) {
            let pending = null;
            try {
              const raw = localStorage.getItem("tm_pending_consent");
              if (raw) pending = JSON.parse(raw);
            } catch (e) {}
            if (pending) {
              try {
                await window.TMAuth.saveConsent(pending);
              } catch (e) {
                /* 실패하면 아래 동의 페이지로 유도된다 */
              }
              try {
                localStorage.removeItem("tm_pending_consent");
              } catch (e) {}
              const again = await window.TMAuth.refreshState();
              if (again.hasConsent) {
                window.location.replace("." + next);
                return;
              }
            }
            window.location.replace("./consent.html?next=" + encodeURIComponent(next));
            return;
          }
          window.location.replace("." + next);
        }

        const naverToken = hashParams.get("naver");

        if (naverToken) {
          // ---- 네이버: Edge Function이 발급한 1회용 토큰으로 세션 개시 ----
          window.TMAuth.completeNaverLogin(naverToken, hashParams.get("state"))
            .then(function (r) {
              if (r && r.next) next = r.next;
              history.replaceState(null, "", window.location.pathname);
              return finish();
            })
            .catch(function (err) {
              fail((err && err.message) || "네이버 로그인에 실패했습니다.");
            });
        } else {
          // ---- 구글/카카오: supabase-js 가 URL 토큰을 세션으로 교환할 때까지 대기 ----
          let tries = 0;
          (function waitSession() {
            tries += 1;
            const c = window.TMAuth.getClient();
            if (!c) return fail("로그인 설정이 완료되지 않았습니다.");
            c.auth.getSession().then(function (r) {
              if (r && r.data && r.data.session) return finish();
              if (tries > 32) return fail("로그인 정보를 확인하지 못했습니다. 다시 시도해주세요.");
              setTimeout(waitSession, 250);
            });
          })();
        }
      })();
    </script>
