    <script>
      (function () {
        function showMsg(text, isError) {
          const el = document.getElementById("login-msg");
          el.textContent = text;
          el.classList.add("is-visible");
          el.classList.toggle("tm-auth-msg--error", !!isError);
          el.classList.toggle("tm-auth-msg--ok", !isError);
        }

        const params = new URLSearchParams(window.location.search);
        const nextParam = window.TMAuth.safeNext(params.get("next") || "") || "/mypage.html";

        function redirectAfterLogin() {
          window.location.href = nextParam;
        }

        // 이메일 인증 완료 후 돌아온 경우 안내
        if (window.location.hash.indexOf("type=signup") !== -1) {
          showMsg("이메일 인증이 완료되었습니다. 로그인해주세요.", false);
        }

        window.TMAuth.attachPasswordToggle(document.getElementById("login-password"));

        window.TMAuth.renderSocialButtons(document.getElementById("login-social"), {
          mode: "login",
          next: nextParam,
          onError: function (err) {
            showMsg((err && err.message) || "소셜 로그인에 실패했습니다.", true);
          },
        });

        document.getElementById("login-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          if (window.TMAuth && window.TMAuth.isSetupPending()) {
            showMsg("아직 로그인 기능 설정 중입니다. 잠시 후 다시 시도해주세요.", true);
            return;
          }
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          const btn = document.getElementById("login-submit");
          btn.disabled = true;
          btn.textContent = "로그인 중…";
          try {
            await window.TMAuth.signIn({ email, password });
            showMsg("로그인 성공! 이동합니다…", false);
            setTimeout(redirectAfterLogin, 400);
          } catch (err) {
            const raw = (err && err.message) || "";
            let msg = raw || "로그인에 실패했습니다.";
            if (/Invalid login credentials/i.test(raw)) msg = "이메일 또는 비밀번호가 올바르지 않습니다.";
            else if (/Email not confirmed/i.test(raw)) msg = "이메일 인증이 아직 완료되지 않았습니다. 메일함을 확인해주세요.";
            else if (/rate limit|too many/i.test(raw)) msg = "시도 횟수가 많습니다. 잠시 후 다시 시도해주세요.";
            showMsg(msg, true);
          } finally {
            btn.disabled = false;
            btn.textContent = "로그인";
          }
        });
      })();
    </script>
