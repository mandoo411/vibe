<!DOCTYPE html>
<!--
  마감 증시 만평 릴스 (9:16, 1080x1920) v2 — 임팩트 우선 재구성.
  치환 변수: DATE SLOT_LABEL HERO_LABEL HERO_DIR(up|down|flat) HERO_ARROW HERO_PCT
  KOSDAQ_DIR(up|down|flat) KOSDAQ_ARROW KOSDAQ_PCT
  HEADLINE BG_DATA_URI
  종목 하이라이트는 STOCKBADGE_START ~ STOCKBADGE_END 사이 블록을 반복 채움 (최대 2개, 크게 강조)
  v1 대비 변경: AI 판단 박스, 내일 주목할 변수(체크포인트) 박스를 완전히 제거하고
  (1) 지수 등락 (2) 오늘 왜 움직였는지 (3) 오늘의 이슈 종목, 이 3가지만 크게 구성한다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="./_shared-light.css" />
<style>
  body {
    height: 1920px;
    background: #ffffff;
    background-image: none;
  }

  .bg-art {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    object-fit: cover;
    z-index: 0;
  }
  .bg-scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.92) 0%,
      rgba(255,255,255,0.60) 16%,
      rgba(255,255,255,0.18) 34%,
      rgba(255,255,255,0.26) 52%,
      rgba(255,255,255,0.74) 68%,
      rgba(255,255,255,0.96) 84%,
      rgba(255,255,255,0.98) 100%);
  }

  .brand-lockup, .watermark, .reel-wrap { z-index: 2; }

  .reel-wrap {
    position: absolute;
    top: 190px;
    left: 64px;
    right: 64px;
    display: flex;
    flex-direction: column;
  }

  .reel-date { margin-bottom: 24px; }

  .reel-eyebrow {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    margin-bottom: 22px;
  }

  /* (1) 지수 등락 — 코스피를 히어로로 크게, 코스닥은 보조 pill로 */
  .hero-index {
    display: flex;
    align-items: baseline;
    gap: 26px;
    margin-bottom: 24px;
  }
  .hero-index .idx-label {
    font-size: 50px;
    font-weight: 800;
    color: var(--text-primary);
  }
  .hero-index .idx-value {
    font-size: 116px;
    font-weight: 800;
    letter-spacing: -3px;
  }
  .hero-index .idx-value.up { color: #e24b4a; }
  .hero-index .idx-value.down { color: #3b82f6; }
  .hero-index .idx-value.flat { color: var(--text-secondary); }

  /* 코스닥 보조 지표 — 완전 불투명한 카드로 만들어 배경 삽화(코인 등)와 겹쳐도 항상 또렷하게 */
  .sub-index {
    display: inline-flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 34px;
    border-radius: 999px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 8px 20px rgba(7,38,75,0.10);
    margin-bottom: 40px;
  }
  .sub-index.up { background: rgba(255,235,234,0.94); }
  .sub-index.down { background: rgba(231,241,255,0.94); }
  .sub-index .idx-label { font-size: 32px; font-weight: 700; color: var(--text-secondary); }
  .sub-index .idx-value { font-size: 42px; font-weight: 800; }
  .sub-index .idx-value.up { color: #e24b4a; }
  .sub-index .idx-value.down { color: #3b82f6; }
  .sub-index .idx-value.flat { color: var(--text-secondary); }

  /* (2) 오늘 왜 움직였는지 — 크고 굵은 한 줄 요약.
     리포트의 "핵심 한 줄"은 날마다 길이가 들쭉날쭉한 원문 문장이라, 길어도 카드가 화면을
     넘어가 아래 종목 카드를 밀어내지 않도록 4줄로 고정 클램프하고 넘치면 말줄임표로 자른다
     (사용자 피드백으로 발견: 문장이 길었던 날 종목 카드가 화면 밖으로 잘림). */
  .reason-card {
    position: relative;
    font-size: 58px;
    font-weight: 700;
    color: var(--text-primary);
    background: rgba(255,255,255,0.86);
    border-left: 10px solid var(--accent-gold);
    padding: 40px 42px;
    border-radius: 0 22px 22px 0;
    line-height: 1.42;
    letter-spacing: -1px;
    margin-bottom: 48px;
    box-shadow: 0 8px 24px rgba(7,38,75,0.08);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* (3) 오늘의 이슈 종목 — 큼직한 카드 */
  .issue-label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 38px;
    font-weight: 800;
    color: var(--accent-gold);
    margin-bottom: 28px;
  }
  .stock-cards {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .stock-card {
    background: rgba(255,255,255,0.90);
    border-radius: var(--radius-lg);
    padding: 40px 44px;
    box-shadow: 0 10px 28px rgba(7,38,75,0.10);
  }
  .stock-card .row1 {
    display: flex;
    align-items: baseline;
    gap: 24px;
    margin-bottom: 16px;
  }
  .stock-card .name {
    font-size: 64px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -1px;
  }
  .stock-card .pct {
    font-size: 64px;
    font-weight: 800;
  }
  .stock-card .reason {
    font-size: 34px;
    font-weight: 500;
    color: var(--text-secondary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>
</head>
<body>
  <img class="bg-art" src="{{BG_DATA_URI}}" />
  <div class="bg-scrim"></div>

  <div class="brand-lockup">
    <div class="logo-box"><span>TM</span><span>AI</span></div>
    <div>
      <div class="brand-name">TotalMoney</div>
      <div class="brand-sub">powered by <span class="ai-badge">AI</span></div>
    </div>
  </div>

  <div class="reel-wrap">
    <div class="reel-date">
      <span class="slot-badge"><span class="dot"></span>{{DATE}} {{SLOT_LABEL}}</span>
    </div>
    <div class="reel-eyebrow">오늘의 마감 시황, 한눈에</div>

    <div class="hero-index">
      <span class="idx-label">{{HERO_LABEL}}</span>
      <span class="idx-value {{HERO_DIR}}">{{HERO_ARROW}} {{HERO_PCT}}%</span>
    </div>
    <div class="sub-index {{KOSDAQ_DIR}}">
      <span class="idx-label">코스닥</span>
      <span class="idx-value {{KOSDAQ_DIR}}">{{KOSDAQ_ARROW}} {{KOSDAQ_PCT}}%</span>
    </div>

    <div class="reason-card">{{HEADLINE}}</div>

    <div class="issue-label">🔥 오늘의 이슈 종목</div>
    <div class="stock-cards">
      <!--STOCKBADGE_START-->
      <!--STOCKBADGE_END-->
    </div>
  </div>

  <div class="watermark">TotalMoney.kr</div>
</body>
</html>
