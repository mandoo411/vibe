<!DOCTYPE html>
<!--
  마감 시황 릴스 v3 — "시장 지수 + 시가총액 TOP10" 포맷 (기존 만평/개구리 마스코트 포맷 폐기, 대체용).
  사용자가 참고 이미지(타 서비스 카드뉴스)를 주고 "우리 스타일로 재구현" 요청 → TotalMoney 브랜드 톤(딥네이비+틸)으로
  재해석. 참고 이미지와 차이점: (1) 이미지 대신 실제 코드 렌더 텍스트만 사용(할루시네이션 방지 원칙 유지)
  (2) 지수 카드가 상승/하락에 따라 배경색 자체가 빨강톤/파랑톤으로 바뀜(참고 이미지는 텍스트 색만 다름)
  (3) 거래대금 상위 대신 시가총액 상위 10종목 (4) 하단에 AI 한줄 논평 추가.

  치환 변수:
  DATE, SLOT_LABEL
  KOSPI_VALUE, KOSPI_DIR(up|down|flat), KOSPI_ARROW, KOSPI_CHANGE, KOSPI_PCT
  KOSDAQ_VALUE, KOSDAQ_DIR, KOSDAQ_ARROW, KOSDAQ_CHANGE, KOSDAQ_PCT
  COMMENT_LINE (한줄 논평, 완결된 문장, 말줄임표 금지 — 자연스러운 지점에서 자르기)
  RANKING_LABEL (예: "시가총액 TOP10" / "상승률 TOP10" / "거래대금 TOP10" — 날짜 기반 로테이션)
  종목 리스트는 MCAPROW_START ~ MCAPROW_END 사이 블록을 반복 채움 (10개, 로테이션되는 랭킹 기준)
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="./_shared.css" />
<style>
  body {
    width: 1080px;
    height: 1920px;
    background: #050b16;
  }

  .bg-art {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    object-fit: cover;
    z-index: 0;
  }
  .bg-scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(5,11,22,0.20) 0%,
      rgba(5,11,22,0.55) 30%,
      rgba(5,11,22,0.72) 55%,
      rgba(5,11,22,0.86) 100%);
  }

  .brand-lockup, .deco-ring, .page-wrap, .watermark { position: absolute; z-index: 2; }

  .page-wrap {
    position: absolute;
    top: 160px;
    left: 64px;
    right: 64px;
    bottom: 170px;
    display: flex;
    flex-direction: column;
  }

  /* Reels 재생 시 하단 우측(음소거 아이콘)과 겹치지 않도록 워터마크를 안쪽으로 당김
     (정적 카드뉴스용 위치 고정 규칙은 유지하되, 릴스 템플릿에서만 오버라이드) */
  .watermark {
    bottom: 120px;
    right: 60px;
  }

  /* ---------- 타이틀 블록 — 날짜+슬롯 한 줄로 통일 (기존 "국내 증시/마감 시황" 2줄 대제목 +
     코너 장식 제거. 사용자 피드백: "브리핑처럼 날짜 + 국내 증시 마감시황 이렇게 한줄로") ---------- */
  .title-line {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .title-line .dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent-gold);
    flex-shrink: 0;
    box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.18);
  }
  .title-line .title-text {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  /* ---------- 시장 지수 ---------- */
  .section-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .section-label .icon-chip { width: 52px; height: 52px; border-radius: 15px; }
  .section-label .icon-chip svg { width: 28px; height: 28px; }
  .section-label .label-text { font-size: 42px; font-weight: 900; color: var(--text-primary); }

  .index-row {
    display: flex;
    gap: 22px;
    margin-bottom: 20px;
  }
  .index-card {
    flex: 1;
    position: relative;
    border-radius: var(--radius-lg);
    padding: 22px 26px 22px 32px;
    overflow: hidden;
    border-left-width: 10px;
    border-left-style: solid;
  }
  .index-card.up { background: linear-gradient(150deg, rgba(226,75,74,0.38) 0%, rgba(17,29,53,0.82) 62%), rgba(17,29,53,0.82); border-left-color: var(--up-color); box-shadow: 0 8px 26px rgba(226,75,74,0.25); }
  .index-card.down { background: linear-gradient(150deg, rgba(59,130,246,0.38) 0%, rgba(17,29,53,0.82) 62%), rgba(17,29,53,0.82); border-left-color: var(--down-color); box-shadow: 0 8px 26px rgba(59,130,246,0.22); }
  .index-card.flat { background: rgba(17,29,53,0.82); border: 1px solid rgba(255,255,255,0.10); }
  .index-card .idx-name {
    font-size: 33px;
    font-weight: 900;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .index-card .idx-code {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .index-card .idx-value {
    font-size: 66px;
    font-weight: 900;
    letter-spacing: -1.5px;
    margin-bottom: 10px;
  }
  .index-card .idx-value.up { color: var(--up-color); }
  .index-card .idx-value.down { color: var(--down-color); }
  .index-card .idx-value.flat { color: var(--text-secondary); }
  .index-card .idx-change {
    font-size: 33px;
    font-weight: 800;
  }
  .index-card .idx-change.up { color: var(--up-color); }
  .index-card .idx-change.down { color: var(--down-color); }
  .index-card .idx-change.flat { color: var(--text-secondary); }

  /* ---------- 한줄 논평 ---------- */
  .comment-bar {
    display: flex;
    align-items: center;
    gap: 18px;
    background: linear-gradient(90deg, rgba(212,175,55,0.20) 0%, rgba(17,29,53,0.82) 45%), rgba(17,29,53,0.82);
    border-left: 9px solid var(--accent-gold);
    border-radius: 0 18px 18px 0;
    padding: 20px 32px;
    margin-bottom: 18px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.30);
  }
  .comment-bar .comment-icon { width: 40px; height: 40px; flex-shrink: 0; }
  .comment-bar .comment-text {
    font-size: 33px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.35;
  }

  /* ---------- 시가총액 TOP10 ---------- */
  .mcap-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .mcap-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 8px 26px 8px 24px;
    border-radius: 18px;
    border-left-width: 8px;
    border-left-style: solid;
  }
  .mcap-row.up { background: linear-gradient(90deg, rgba(226,75,74,0.28) 0%, rgba(17,29,53,0.80) 55%), rgba(17,29,53,0.80); border-left-color: var(--up-color); }
  .mcap-row.down { background: linear-gradient(90deg, rgba(59,130,246,0.28) 0%, rgba(17,29,53,0.80) 55%), rgba(17,29,53,0.80); border-left-color: var(--down-color); }
  .mcap-row .rank {
    width: 48px;
    height: 48px;
    border-radius: 13px;
    background: var(--gradient-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    flex-shrink: 0;
  }
  .mcap-row .rank.gold { background: linear-gradient(135deg, #ffd84d 0%, #ffb830 100%); color: #07264b; }
  .mcap-row .stock-info { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; }
  .mcap-row .stock-name {
    font-size: 34px;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mcap-row .stock-price {
    font-size: 34px;
    font-weight: 800;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .mcap-row .stock-change {
    font-size: 34px;
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .mcap-row .stock-change.up { color: var(--up-color); }
  .mcap-row .stock-change.down { color: var(--down-color); }
  .mcap-row .stock-change.flat { color: var(--text-secondary); }
  .mcap-row .stock-pct {
    font-size: 34px;
    font-weight: 800;
    flex-shrink: 0;
    text-align: right;
  }
  .mcap-row .stock-pct.up { color: var(--up-color); }
  .mcap-row .stock-pct.down { color: var(--down-color); }
  .mcap-row .stock-pct.flat { color: var(--text-secondary); }
</style>
</head>
<body>
  <img class="bg-art" src="{{BG_DATA_URI}}" />
  <div class="bg-scrim"></div>

  <div class="brand-lockup">
    <div class="logo-box"><span>TM</span><span>AI</span></div>
    <div>
      <div class="brand-name">TotalMoney</div>
      <div class="brand-sub">powered by <span class="ai-badge">AI</span></div>
    </div>
  </div>

  <div class="page-wrap">
    <div class="title-line">
      <span class="dot"></span>
      <span class="title-text">{{DATE}} 국내 증시 마감시황</span>
    </div>

    <div class="section-label">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 19V10M12 19V5M20 19V13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label-text">오늘의 시장 지수</div>
    </div>
    <div class="index-row">
      <div class="index-card {{KOSPI_DIR}}">
        <div class="idx-name">코스피</div>
        <div class="idx-code">KOSPI</div>
        <div class="idx-value {{KOSPI_DIR}}">{{KOSPI_VALUE}}</div>
        <div class="idx-change {{KOSPI_DIR}}">{{KOSPI_ARROW}} {{KOSPI_CHANGE}} ({{KOSPI_PCT}}%)</div>
      </div>
      <div class="index-card {{KOSDAQ_DIR}}">
        <div class="idx-name">코스닥</div>
        <div class="idx-code">KOSDAQ</div>
        <div class="idx-value {{KOSDAQ_DIR}}">{{KOSDAQ_VALUE}}</div>
        <div class="idx-change {{KOSDAQ_DIR}}">{{KOSDAQ_ARROW}} {{KOSDAQ_CHANGE}} ({{KOSDAQ_PCT}}%)</div>
      </div>
    </div>

    <div class="comment-bar">
      <svg class="comment-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5h16v11H8l-4 4V5z" stroke="#0f8387" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
      <span class="comment-text">{{COMMENT_LINE}}</span>
    </div>

    <div class="section-label">
      <div class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 21h18M5 21V9l4-3 4 3v12M13 21V5l4-2 4 2v16" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="label-text">{{RANKING_LABEL}}</div>
    </div>
    <div class="mcap-list">
      <!--MCAPROW_START-->
      <!--MCAPROW_END-->
    </div>
  </div>

  <div class="watermark">TotalMoney.kr</div>
</body>
</html>
